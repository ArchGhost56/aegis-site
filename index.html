<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

      body {
        background-color: #0d1117;
        font-family: 'Orbitron', sans-serif;
        color: #f97316;
      }
      .modern-border {
        border: 1px solid #30363d;
        border-radius: 1rem;
      }
      .hero {
        background-color: #161b22;
        padding: 6rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 2rem;
      }
      .hero-title {
        font-size: 2.75rem;
        font-weight: bold;
        color: #f97316;
        text-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
      }
      .hero-subtitle {
        font-size: 1rem;
        color: #eab308;
        margin-top: 1rem;
        max-width: 700px;
        line-height: 1.6;
      }
      .hero-buttons button {
        background-color: #f97316;
        color: #0d1117;
        padding: 0.75rem 1.5rem;
        margin: 0.5rem;
        border-radius: 0.5rem;
        font-weight: bold;
        transition: 0.3s;
        box-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
      }
      .hero-buttons button:hover {
        background-color: #fb923c;
        box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
      }
      .shield-svg {
        width: 100px;
        height: auto;
        filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.5));
        transition: transform 0.3s ease;
      }
      .shield-svg:hover {
        transform: scale(1.05);
        filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.8));
      }
    </style>
  </head>
  <body>
    <header class="bg-[#161b22] shadow-lg z-10 relative modern-border m-4">
      <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
        <h1 class="text-2xl font-bold tracking-widest text-[#f97316]">ÆGIS</h1>
        <nav class="space-x-6 text-[#eab308]">
          <a href="#" class="hover:text-[#f97316]">Home</a>
        </nav>
      </div>
    </header>

    <section class="hero modern-border m-4">
      <svg class="shield-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 2L12 8V24C12 40 21 52 32 60C43 52 52 40 52 24V8L32 2Z" stroke="#f97316" stroke-width="2" fill="none"/>
      </svg>
      <h2 class="hero-title">Your Shield, Your Control</h2>
      <p class="hero-subtitle">
        Create, manage, and customize your security ecosystem in one centralized platform. ÆGIS gives you total control with simplicity, scalability, and style.
      </p>
      <div class="hero-buttons">
        <button onclick="alert('Getting started...')">Get Started</button>
        <button onclick="alert('Learn more...')">Learn More</button>
      </div>
    </section>

    <footer class="bg-[#161b22] py-6 text-center text-[#eab308] text-sm modern-border m-4">
      &copy; 2025 ÆGIS Security Systems. All rights reserved.
    </footer>
  </body>
</html>

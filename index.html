<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

      body {
        background: linear-gradient(to right, #0a0a0a, #000);
        font-family: 'Orbitron', sans-serif;
        color: #f97316;
      }
      .glow {
        text-shadow: 0 0 10px #f97316, 0 0 20px #f97316;
      }
      .circuit-border {
        position: relative;
        border: 2px solid transparent;
        border-radius: 1rem;
      }
      .circuit-border::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        z-index: -1;
        background: linear-gradient(45deg, #f97316, #000, #f97316);
        background-size: 400% 400%;
        animation: gradient-border 6s ease infinite;
        border-radius: 1rem;
      }
      @keyframes gradient-border {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .hero {
        background: radial-gradient(circle at center, #1a1a1a, #000);
        padding: 6rem 1rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 2rem;
      }
      .hero-text {
        max-width: 600px;
      }
      .hero-title {
        font-size: 3rem;
        font-weight: bold;
        color: #f97316;
      }
      .hero-subtitle {
        font-size: 1rem;
        color: #f97316;
        margin-top: 1rem;
        line-height: 1.6;
      }
      .hero-buttons button {
        background-color: #f97316;
        color: black;
        padding: 0.75rem 1.5rem;
        margin-right: 1rem;
        border-radius: 0.5rem;
        font-weight: bold;
        transition: 0.3s;
      }
      .hero-buttons button:hover {
        background-color: black;
        color: #f97316;
        border: 1px solid #f97316;
      }
      .hero-graphic {
        position: relative;
        text-align: center;
      }
      .shield-skull {
        width: 200px;
        margin: 0 auto;
        filter: drop-shadow(0 0 12px #f97316);
      }
    </style>
  </head>
  <body>
    <header class="bg-black bg-opacity-80 shadow-lg z-10 relative circuit-border m-4">
      <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
        <h1 class="text-2xl font-bold tracking-widest text-orange-500 glow">ÆGIS</h1>
        <nav class="space-x-6 text-orange-300">
          <a href="#" class="hover:text-orange-400">Home</a>
          <a href="#features" class="hover:text-orange-400">Features</a>
          <a href="#contact" class="hover:text-orange-400">Contact</a>
        </nav>
      </div>
    </header>

    <section class="hero circuit-border m-4">
      <div class="hero-text">
        <h2 class="hero-title glow">SECURE YOUR WORLD<br>WITH ONE SHIELD</h2>
        <p class="hero-subtitle">
          Simplify your protection with Aegis Shield. Manage all your digital defenses in one powerful, intuitive system—always on, always alert.
        </p>
        <div class="hero-buttons mt-4">
          <button>GET STARTED</button>
          <button>LEARN MORE</button>
        </div>
      </div>
      <div class="hero-graphic">
        <!-- Replaced SVG with external image reference -->
        <img src="aegis-skull-logo.png" alt="Aegis Skull Logo" class="shield-skull" />
      </div>
    </section>

    <footer class="bg-black py-6 text-center text-orange-700 text-sm circuit-border m-4">
      &copy; 2025 ÆGIS Security Systems. All rights reserved.
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

      body {
        background: linear-gradient(to right, #0a0a0a, #000);
        font-family: 'Orbitron', sans-serif;
        color: #f97316;
      }
      .glow {
        text-shadow: 0 0 6px #f97316, 0 0 12px #f97316;
      }
      .circuit-border {
        position: relative;
        border: 2px solid transparent;
        border-radius: 1rem;
      }
      .circuit-border::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        z-index: -1;
        background: linear-gradient(45deg, #f97316, #000, #f97316);
        background-size: 400% 400%;
        animation: gradient-border 6s ease infinite;
        border-radius: 1rem;
        opacity: 0.4;
      }
      @keyframes gradient-border {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .hero {
        background: radial-gradient(circle at center, #1a1a1a, #000);
        padding: 6rem 1rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        text-align: left;
        gap: 2rem;
      }
      .hero-text {
        max-width: 600px;
      }
      .hero-title {
        font-size: 3rem;
        font-weight: bold;
        color: #f97316;
      }
      .hero-subtitle {
        font-size: 1rem;
        color: #f97316;
        margin-top: 1rem;
        line-height: 1.6;
      }
      .hero-buttons button {
        background-color: #f97316;
        color: black;
        padding: 0.75rem 1.5rem;
        margin-right: 1rem;
        border-radius: 0.5rem;
        font-weight: bold;
        transition: 0.3s;
      }
      .hero-buttons button:hover {
        background-color: black;
        color: #f97316;
        border: 1px solid #f97316;
      }
      .hero-graphic {
        animation: pulse-glow 3s infinite ease-in-out;
        max-width: 80vw;
      }
      .shield-svg {
        width: 100%;
        max-width: 240px;
        height: auto;
        filter: drop-shadow(0 0 18px #f97316);
      }
      .shield-svg path {
        fill: url(#gradient-motion);
        stroke: url(#gradient-motion);
      }
      @keyframes pulse-glow {
        0%, 100% {
          filter: drop-shadow(0 0 10px #f97316);
        }
        50% {
          filter: drop-shadow(0 0 25px #f97316);
        }
      }
    </style>
  </head>
  <body>
    <header class="bg-black bg-opacity-80 shadow-lg z-10 relative circuit-border m-4">
      <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
        <h1 class="text-2xl font-bold tracking-widest text-orange-500 glow">ÆGIS</h1>
        <nav class="space-x-6 text-orange-300">
          <a href="#" class="hover:text-orange-400">Home</a>
          <a href="#features" class="hover:text-orange-400">Features</a>
          <a href="#contact" class="hover:text-orange-400">Contact</a>
        </nav>
      </div>
    </header>

    <section class="hero circuit-border m-4">
      <div class="hero-text">
        <h2 class="hero-title glow">SECURE YOUR WORLD<br>WITH ONE SHIELD</h2>
        <p class="hero-subtitle">
          Simplify your protection with Aegis Shield. Manage all your digital defenses in one powerful, intuitive system—always on, always alert.
        </p>
        <div class="hero-buttons mt-4">
          <button>GET STARTED</button>
          <button>LEARN MORE</button>
        </div>
      </div>
      <div class="hero-graphic">
        <svg class="shield-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient-motion" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%">
                <animate attributeName="stop-color" values="#f97316;#ff4500;#f97316" dur="4s" repeatCount="indefinite" />
              </stop>
              <stop offset="100%">
                <animate attributeName="stop-color" values="#ff4500;#f97316;#ff4500" dur="4s" repeatCount="indefinite" />
              </stop>
            </linearGradient>
          </defs>
          <path d="M32 2L12 8V24C12 40 21 52 32 60C43 52 52 40 52 24V8L32 2Z" stroke-width="2"/>
        </svg>
      </div>
    </section>

    <footer class="bg-black py-6 text-center text-orange-700 text-sm circuit-border m-4">
      &copy; 2025 ÆGIS Security Systems. All rights reserved.
    </footer>
  </body>
</html>
